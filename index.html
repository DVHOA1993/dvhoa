<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Dashboard - 2 Column Layout</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/5.0.11/signalr.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>🤖 Robot Control Dashboard</h2>
        
        <!-- Main robot container với 2 bên -->
        <div class="robot-container">
            <!-- Bên trái - Production Line A -->
            <div class="robot-side">
                <div class="side-label">
                    🏭 Production Line A
                </div>
                <div id="robotGridLeft" class="robot-grid">
                    <!-- Robots sẽ được thêm vào đây bằng JavaScript -->
                </div>
            </div>
            
            <!-- Separator line -->
            <div class="separator"></div>
            
            <!-- Bên phải - Production Line B -->
            <div class="robot-side">
                <div class="side-label">
                    🔧 Production Line B
                </div>
                <div id="robotGridRight" class="robot-grid">
                    <!-- Robots sẽ được thêm vào đây bằng JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Floating action buttons -->
    <div class="floating-buttons">
        <button class="floating-btn add-btn" onclick="showAddModal()" title="Thêm Robot">
            ➕
        </button>
        <button class="floating-btn log-btn" onclick="toggleLog()" title="Toggle Debug Log">
            🔍
        </button>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addEditModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" class="modal-title">Thêm Robot Mới</h3>
            <input type="text" id="modalInput" class="modal-input" placeholder="Nhập IP Robot (VD: 192.168.33.1)">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="confirmAddEdit()">Xác nhận</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">Xác nhận xóa Robot</h3>
            <p style="margin-bottom: 25px; color: #6c757d;">
                Bạn có chắc chắn muốn xóa robot <strong id="deleteRobotName"></strong>?
            </p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-danger" onclick="confirmDelete()">Xóa</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
